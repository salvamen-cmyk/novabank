workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - validate
  - sast
  - dast

variables:
  DAST_HOST: "novabank-salva.duckdns.org"

helm_lint:
  stage: validate
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  script:
    - helm version
    - helm lint helm/novabank
    - helm template novabank helm/novabank --namespace novabank-app > /tmp/novabank-rendered.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

semgrep_sast:
  stage: sast
  image:
    name: semgrep/semgrep
    entrypoint: [""]
  script:
    - semgrep --version
    - semgrep scan --config auto --json --output semgrep-report.json --error .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep-report.json
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

zap_dast:
  stage: dast
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  script:
    - mkdir -p reports
    - TARGET="https://${DAST_HOST}"
    - echo "DAST_TARGET=${TARGET}"
    - zap-baseline.py
        -t "${TARGET}"
        -J "${CI_PROJECT_DIR}/reports/zap-report.json"
        -r "${CI_PROJECT_DIR}/reports/zap-report.html"
        -w "${CI_PROJECT_DIR}/reports/zap-report.md"
        -I
        -T 5
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/zap-report.json
      - reports/zap-report.html
      - reports/zap-report.md
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
