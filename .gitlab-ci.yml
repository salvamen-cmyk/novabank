workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - validate
  - sast
  - dynamic_security

variables:
  DAST_HOST: "novabank-salva.duckdns.org"

helm_lint:
  stage: validate
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  script:
    - helm version
    - helm lint helm/novabank
    - helm template novabank helm/novabank --namespace novabank-app > /tmp/novabank-rendered.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

semgrep_sast:
  stage: sast
  image:
    name: semgrep/semgrep
    entrypoint: [""]
  script:
    - semgrep --version
    - semgrep scan --config auto --json --output semgrep-report.json .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep-report.json
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

zap_baseline:
  stage: dynamic_security
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  script:
    - mkdir -p "$CI_PROJECT_DIR/reports"
    - TARGET="https://${DAST_HOST}"
    - echo "DAST_TARGET=${TARGET}"
    - |
      cat > "$CI_PROJECT_DIR/zap-plan.yaml" <<EOF
      env:
        contexts:
          - name: novabank
            urls:
              - "${TARGET}"
        parameters:
          failOnError: true
          failOnWarning: false
          progressToStdout: true

      jobs:
        - type: passiveScan-config
          parameters:
            enableTags: false
            maxAlertsPerRule: 10
            scanOnlyInScope: true

        - type: spider
          parameters:
            context: novabank
            url: "${TARGET}"
            maxDuration: 1

        - type: passiveScan-wait
          parameters:
            maxDuration: 5

        - type: report
          parameters:
            template: traditional-html
            reportDir: "${CI_PROJECT_DIR}/reports"
            reportFile: "zap-report.html"
            reportTitle: "NovaBank ZAP passive baseline"

        - type: report
          parameters:
            template: traditional-json
            reportDir: "${CI_PROJECT_DIR}/reports"
            reportFile: "zap-report.json"
            reportTitle: "NovaBank ZAP passive baseline"

        - type: report
          parameters:
            template: traditional-md
            reportDir: "${CI_PROJECT_DIR}/reports"
            reportFile: "zap-report.md"
            reportTitle: "NovaBank ZAP passive baseline"

        - type: exitStatus
          parameters:
            warnExitValue: 0
            errorExitValue: 1
          alwaysRun: true
      EOF
    - zap.sh -cmd -autorun "$CI_PROJECT_DIR/zap-plan.yaml"
    - echo "=== ZAP REPORTS ==="
    - ls -lh "$CI_PROJECT_DIR/reports"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/zap-report.json
      - reports/zap-report.html
      - reports/zap-report.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
